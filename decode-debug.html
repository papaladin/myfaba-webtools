<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faba Decoder — debug tool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fef9f6; color: #1f1a2e;
      font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 2rem 1rem;
    }
    h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    .sub { color: #5a5570; font-size: 0.85rem; margin-bottom: 2rem; }
    .card {
      width: 100%; max-width: 560px; background: #fff;
      border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 1.75rem; margin-bottom: 1rem;
    }
    #dropzone {
      border: 2px dashed #ede8e3; border-radius: 8px;
      padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s; margin-bottom: 1rem;
    }
    #dropzone:hover, #dropzone.over { border-color: #e8533a; background: rgba(232,83,58,0.06); }
    #dropzone p { color: #5a5570; }
    #dropzone strong { color: #1f1a2e; }
    #file-input { display: none; }

    .result { display: none; margin-top: 1rem; }
    .result.visible { display: block; }

    .info-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: #5a5570; padding: 0.3rem 0; border-bottom: 1px solid #ede8e3; }
    .info-row strong { color: #1f1a2e; }

    .log {
      background: #f8f8f8; border-radius: 6px; padding: 0.85rem;
      font-family: monospace; font-size: 0.78rem; color: #333;
      margin: 1rem 0; max-height: 160px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
    }
    .ok  { color: #2da05a; }
    .err { color: #e8533a; font-weight: bold; }
    .warn { color: #b45309; }

    button {
      background: #e8533a; color: #fff; border: none; border-radius: 50px;
      padding: 0.7rem 1.5rem; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #c43d27; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    audio { width: 100%; margin-top: 1rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>🔍 Faba Decoder — debug tool</h1>
  <p class="sub">Drop a file from your Faba Box (e.g. CP01.MKI from K5326/) to verify the encoding. You should get a playable MP3 back.</p>

    </div>
    <input type="file" id="file-input" accept=".mki,.MKI">

    <div class="result" id="result">
      <div id="info"></div>
      <div class="log" id="log"></div>
      <button id="btn-download" disabled>Download as .mp3</button>
      <audio id="player" controls></audio>
    </div>
  </div>

  function decipherBytes(input) {
    const output = new Uint8Array(input.length);
    for (let i = 0; i < input.length; i++) {
      output[i] = DECIPHER[i % 4][input[i]];
    }
    return output;
  }

  function hexDump(bytes, maxBytes = 32) {
    let out = '';
    const n = Math.min(bytes.length, maxBytes);
    for (let i = 0; i < n; i++) {
      out += bytes[i].toString(16).padStart(2,'0') + ' ';
      if ((i+1) % 16 === 0) out += '\n';
    }
    return out.trim();
  }

  function checkMp3Header(bytes) {
    // ID3v2 tag starts with "ID3"
    if (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33)
      return 'ID3v2 tag found ✓ — looks like a valid MP3';
    // Raw MP3 sync word: 0xFF 0xFB / 0xFF 0xFA / 0xFF 0xF3 etc.
    if (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0)
      return 'MP3 sync word found ✓ — looks like a valid MP3 (no ID3 tag)';
    return `Unknown header: ${bytes[0].toString(16)} ${bytes[1].toString(16)} ${bytes[2].toString(16)} — may not be valid MP3`;
  }

  function readTextFrame(bytes) {
    if (!bytes || bytes.length < 1) return '';

    const encoding = bytes[0];
    const payload = bytes.slice(1);

    // ID3 text-frame encoding byte:
    // 0 = ISO-8859-1, 1 = UTF-16 with BOM, 2 = UTF-16BE, 3 = UTF-8.
    try {
      if (encoding === 1) {
        // Real Faba files use UTF-16 LE with a BOM (FF FE). TextDecoder
        // understands the BOM and will correctly decode the remaining text.
        return new TextDecoder('utf-16').decode(payload).replace(/\u0000+$/, '');
      }
      if (encoding === 2) {
        return new TextDecoder('utf-16be').decode(payload).replace(/\u0000+$/, '');
      }
      if (encoding === 3) {
        return new TextDecoder('utf-8').decode(payload).replace(/\u0000+$/, '');
      }
      // Encoding 0 is ISO-8859-1. TextDecoder('windows-1252') is the
      // closest broadly supported browser decoder and matches this use well.
      return new TextDecoder('windows-1252').decode(payload).replace(/\u0000+$/, '');
    } catch (_) {
      // Conservative fallback for unusual encodings.
      return new TextDecoder().decode(payload).replace(/\u0000+$/, '');
    }
  }

  function readID3Title(bytes) {
    if (!(bytes[0]===0x49 && bytes[1]===0x44 && bytes[2]===0x33)) return null;

    const majorVersion = bytes[3];
    // ID3v2.3/v2.4 frame sizes are the common Faba formats.
    if (majorVersion < 3 || majorVersion > 4) return null;

    let i = 10;
    while (i + 10 <= bytes.length) {
      // Zero padding marks the end of the frame area.
      if (bytes[i]===0 && bytes[i+1]===0 && bytes[i+2]===0 && bytes[i+3]===0) break;

      const frameId = String.fromCharCode(bytes[i],bytes[i+1],bytes[i+2],bytes[i+3]);
      let size;
      if (majorVersion === 4) {
        // ID3v2.4 frame sizes are syncsafe.
        size = ((bytes[i+4] & 0x7F) << 21) |
               ((bytes[i+5] & 0x7F) << 14) |
               ((bytes[i+6] & 0x7F) << 7)  |
               (bytes[i+7] & 0x7F);
      } else {
        // ID3v2.3 frame sizes are normal big-endian 32-bit integers.
        size = ((bytes[i+4] << 24) >>> 0) |
               (bytes[i+5] << 16) | (bytes[i+6] << 8) | bytes[i+7];
      }

      if (size <= 0 || size > 10000 || i + 10 + size > bytes.length) break;
      if (frameId === 'TIT2') {
        return readTextFrame(bytes.slice(i + 10, i + 10 + size));
      }
      i += 10 + size;
    }
    return null;
  }

  // ── UI ──
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const resultEl = document.getElementById('result');
  const infoEl = document.getElementById('info');
  const logEl = document.getElementById('log');
  const btnDownload = document.getElementById('btn-download');
  const player = document.getElementById('player');

  let decodedBytes = null;
  let fileName = '';

  function log(msg, cls='') {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    logEl.appendChild(line);
  }

  async function processFile(file) {
    logEl.innerHTML = '';
    infoEl.innerHTML = '';
    resultEl.classList.add('visible');
    btnDownload.disabled = true;
    player.src = '';
    fileName = file.name;

    const ext = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
    if (ext !== 'mki') {
      log(`Warning: expected a .MKI Faba file, got .${ext || '(no extension)'}. Decoding is attempted anyway.`, 'warn');
    } else {
      log('Faba .MKI file detected ✓', 'ok');
    }
    log(`File: ${file.name} (${(file.size/1024).toFixed(1)} KB)`);

    const buf = await file.arrayBuffer();
    const raw = new Uint8Array(buf);

    log(`First 8 raw bytes: ${hexDump(raw, 8)}`);

    // Decipher
    log('Applying decipher…');
    const decoded = decipherBytes(raw);

    // Check result
    const headerCheck = checkMp3Header(decoded);
    log(headerCheck, headerCheck.includes('✓') ? 'ok' : 'warn');

    log(`First 8 decoded bytes: ${hexDump(decoded, 8)}`);

    // Try to read ID3 title
    const title = readID3Title(decoded);
    if (title) {
      log(`ID3 TIT2 title: "${title}"`, 'ok');
      // Expected format: K5326CP01
      if (/^K\d{4}CP\d{2}$/.test(title)) {
        log(`Title format correct ✓`, 'ok');
      } else {
        log(`Title format unexpected — expected K####CP##`, 'warn');
      }
    } else {
      log('No ID3 TIT2 title found', 'warn');
    }

    decodedBytes = decoded;

    // Try to play in browser
    const blob = new Blob([decoded], { type: 'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    player.src = url;
    btnDownload.disabled = false;

    log('Done. Try playing below, or download to check in a media player.', 'ok');
  }

  btnDownload.addEventListener('click', () => {
    if (!decodedBytes) return;
    const blob = new Blob([decodedBytes], { type: 'audio/mpeg' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName + '_decoded.mp3';
    a.click();
  });

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') fileInput.click(); });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) processFile(fileInput.files[0]); });
  </script>
